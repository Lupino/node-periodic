name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
        rsa_mode: [Normal, Plain, RSA, AES]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pull periodicd
        run: docker pull lupino/periodicd:1.2.8.0

      - name: Generate RSA keypairs
        if: matrix.rsa_mode != 'Normal'
        run: |
          set -euo pipefail

          # Generate PKCS#1 keys (BEGIN RSA PRIVATE KEY) for maximum compatibility
          # OpenSSL 3 `genpkey` doesn't support `-traditional`; generate PKCS#8 then convert to PKCS#1.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out client_private.pem
          openssl rsa -in client_private.pem -traditional -out client_private_pkcs1.pem
          mv client_private_pkcs1.pem client_private.pem
          openssl rsa -in client_private.pem -RSAPublicKey_out -out client_public.pem

          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out server_private.pem
          openssl rsa -in server_private.pem -traditional -out server_private_pkcs1.pem
          mv server_private_pkcs1.pem server_private.pem
          openssl rsa -in server_private.pem -RSAPublicKey_out -out server_public.pem

      - name: Start periodicd (tcp :5000)
        run: |
          if [ "${{ matrix.rsa_mode }}" = "Normal" ]; then
            docker run -d --name periodicd -p 5000:5000 lupino/periodicd:1.2.8.0
          else
            docker run -d --name periodicd -p 5000:5000 \
              -v "$PWD/server_private.pem:/keys/private.pem:ro" \
              -v "$PWD/client_public.pem:/keys/client_public.pem:ro" \
              -v "$PWD/server_public.pem:/keys/public.pem:ro" \
              lupino/periodicd:1.2.8.0 \
              --rsa-private-path /keys/private.pem \
              --rsa-public-path /keys/client_public.pem
          fi

          # wait for port
          for i in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/5000) >/dev/null 2>&1 && break
            sleep 0.2
          done
          (echo > /dev/tcp/127.0.0.1/5000)

      - name: Test
        env:
          PERIODIC_RSA_MODE: ${{ matrix.rsa_mode }}
          PERIODIC_CLIENT_PRIVATE_KEY: client_private.pem
          PERIODIC_SERVER_PUBLIC_KEY: server_public.pem
        run: npm test

      - name: Cleanup
        if: always()
        run: |
          docker logs periodicd || true
          docker rm -f periodicd || true

  auth-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pull periodicd
        run: docker pull lupino/periodicd:1.2.9.0

      - name: Write auth file
        run: |
          cat > periodic-auth.txt <<EOF
          client client-a token-client-a test,test_worker,test_run_job_worker,test_run_job_worker_sched_later,test_run_job_worker_fail
          worker worker-a token-worker-a test_worker,test_run_job_worker,test_run_job_worker_sched_later,test_run_job_worker_fail
          EOF

      - name: Start periodicd (tcp :5000)
        run: |
          docker run -d --name periodicd -p 5000:5000 \
            -v "$PWD/periodic-auth.txt:/keys/periodic-auth.txt:ro" \
            lupino/periodicd:1.2.9.0 \
            --auth-file /keys/periodic-auth.txt

          for i in $(seq 1 50); do
            (echo > /dev/tcp/127.0.0.1/5000) >/dev/null 2>&1 && break
            sleep 0.2
          done
          (echo > /dev/tcp/127.0.0.1/5000)

      - name: Test with client auth
        env:
          PERIODIC_CLIENT_NAME: client-a
          PERIODIC_CLIENT_TOKEN: token-client-a
          PERIODIC_WORKER_NAME: worker-a
          PERIODIC_WORKER_TOKEN: token-worker-a
        run: npm test

      - name: Cleanup
        if: always()
        run: |
          docker logs periodicd || true
          docker rm -f periodicd || true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]

    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install
        run: npm ci

      - name: Publish
        run: npm publish --provenance
